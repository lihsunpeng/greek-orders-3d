<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>希臘三柱式 3D 檢視器 The Three Greek Orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F894BB'/%3E%3Crect x='24' y='14' width='16' height='36' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=4">
<script type="importmap">{"imports":{"three":"./assets/three/build/three.module.js","three/addons/":"./assets/three/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<header id="top">
  <div id="title"><span class="t1">希臘三柱式 3D</span><span class="t2">The Three Greek Orders</span></div>
  <nav id="views" aria-label="視角 Views">
    <button data-view="all" class="on">全景<small>Overview</small></button>
    <button data-view="0">多立克<small>Doric</small></button>
    <button data-view="1">愛奧尼克<small>Ionic</small></button>
    <button data-view="2">柯林斯<small>Corinthian</small></button>
    <button data-view="cap">柱頭特寫<small>Capital</small></button>
    <button id="spin" aria-pressed="false">自轉<small>Spin</small></button>
  </nav>
</header>
<div id="hint">拖曳旋轉・雙指／滾輪縮放<span> Drag to rotate · pinch / wheel to zoom</span></div>
<aside id="panel">
  <button id="fold" aria-label="收合／展開說明">▾</button>
  <div id="tabs" role="tablist">
    <button data-tab="0" class="on">多立克</button><button data-tab="1">愛奧尼克</button><button data-tab="2">柯林斯</button><button data-tab="hand">講義</button><button data-tab="src">出處</button>
  </div>
  <div id="body"></div>
</aside>
<div id="lb" hidden role="dialog" aria-label="講義 Handout">
  <div id="lbbar"><span id="lbt">講義・希臘三柱式比較表</span><span id="lbtools"><button id="lbminus" aria-label="縮小">－</button><span id="lbz">100%</span><button id="lbplus" aria-label="放大">＋</button><button id="lbclose">✕ 關閉</button></span></div>
  <div id="lbsc"><img id="lbimg" alt="希臘三柱式比較表（彩色 3D 版）"></div>
</div>
<div id="loading">載入中… Loading</div>
<script type="module" src="main.js?v=4"></script>
</body>
</html>
